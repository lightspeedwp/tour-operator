version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      time: "03:00"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 10
    labels:
      - area:dependencies
      - github_actions

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      time: "03:00"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 10
    labels:
      - area:dependencies

  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      time: "03:00"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 10
    labels:
      - area:dependencies

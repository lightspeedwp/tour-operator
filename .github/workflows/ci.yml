name: CI

on:
  pull_request:
  push:
    branches: ["develop", "2.1-trunk"]

# Narrowed CI: gates on the checks that reliably pass today — block asset build
# and the standalone PHPUnit suite. PHPCS runs but is non-blocking while the
# legacy includes/ code still carries pre-existing WordPress-Extra violations.
#
# Deliberately NOT run here (tracked as a separate toolchain-repair task):
#   - npm run lint:js / lint:css  -> large pre-existing prettier/import debt
#   - Playwright e2e              -> needs a running WordPress server (wp-env),
#                                    the playwright webServer block is disabled

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Don't leave the GITHUB_TOKEN in .git/config for later build steps.
          persist-credentials: false

      # --- JS build ---
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Build block assets
        run: npm run build

      # --- PHP ---
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install Composer deps
        run: composer install --no-interaction --no-progress
      - name: PHPUnit (standalone, no WordPress required)
        # tests/php also holds WordPress-integration tests (bootstrap.php
        # loads a full WP test suite), so this stays an explicit file list
        # rather than the directory as a whole -- see TESTING.md.
        run: >-
          vendor/bin/phpunit --no-configuration
          tests/php/TestSimpleFunctions.php
          tests/php/TestItineraryEditorPerformance.php
          tests/php/TestItineraryFeaturedImage.php

      # Non-blocking until the legacy WPCS debt is cleared (or scoped to changed
      # files). Flip continue-on-error to false to make it gate the build.
      - name: PHP CodeSniffer (WPCS) — non-blocking
        continue-on-error: true
        run: composer phpcs

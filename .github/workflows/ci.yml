name: CI

on:
  pull_request:
  push:
    # main included so a broken dependency tree there is caught by CI rather
    # than discovered by the next PR opened against it.
    branches: ["main", "develop", "2.1-trunk"]

# Narrowed CI: gates on the checks that reliably pass today — block asset build
# and the standalone PHPUnit suite. PHPCS runs but is non-blocking while the
# legacy includes/ code still carries pre-existing WordPress-Extra violations.
#
# Deliberately NOT run here (tracked as a separate toolchain-repair task):
#   - npm run lint:js / lint:css  -> large pre-existing prettier/import debt
#   - Playwright e2e              -> needs a running WordPress server (wp-env),
#                                    the playwright webServer block is disabled
#
# The wp-integration job below runs the WordPress integration suite against a
# MariaDB service container. WordPress core and its PHPUnit test suite both come
# from Composer (roots/wordpress-no-content and wp-phpunit/wp-phpunit), so there
# is no download script and no Subversion dependency.

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Don't leave the GITHUB_TOKEN in .git/config for later build steps.
          persist-credentials: false

      # --- JS build ---
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Build block assets
        run: npm run build

      # Guards against the plugin header, readme Stable tag, LSX_TO_VER and
      # package.json drifting apart, which they had.
      - name: Check version sources agree
        run: npm run lint:version

      # --- PHP ---
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install Composer deps
        run: composer install --no-interaction --no-progress
      - name: PHPUnit (standalone, no WordPress required)
        # phpunit-simple.xml scopes the run to the standalone tests and excludes
        # the WordPress-integration ones, so new test files are picked up without
        # editing a list here -- see TESTING.md.
        run: vendor/bin/phpunit -c phpunit-simple.xml

      # Non-blocking until the legacy WPCS debt is cleared (or scoped to changed
      # files). Flip continue-on-error to false to make it gate the build.
      - name: PHP CodeSniffer (WPCS) — non-blocking
        continue-on-error: true
        run: composer phpcs

  wp-integration:
    name: WordPress integration tests
    runs-on: ubuntu-latest

    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: tour_operator_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      WP_TESTS_DB_NAME: tour_operator_test
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
      WP_TESTS_DB_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, xml, zip, intl
          coverage: none
          tools: composer

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer deps
        run: composer install --no-interaction --no-progress

      # The WordPress core test suite only supports PHPUnit 8 and 9: its
      # expectDeprecated() calls PHPUnit\Util\Test::parseTestMethodAnnotations(),
      # removed in PHPUnit 10 (core.trac.wordpress.org/ticket/59486). The standalone
      # suite still runs on PHPUnit 10 in the build-test job; only this one downgrades.
      - name: Resolve PHPUnit 9 for the WordPress test suite
        run: composer test:wp:downgrade

      - name: Wait for the database
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u root -proot --silent; then
              echo "database is up"
              exit 0
            fi
            sleep 2
          done
          echo "database did not become ready" >&2
          exit 1

      - name: PHPUnit (WordPress integration)
        run: composer test:wp

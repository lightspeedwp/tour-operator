name: WPCS Check

on:
  pull_request:
    branches: [ 2.1-trunk, main, master ]
  push:
    branches: [ 2.1-trunk ]
  workflow_dispatch: {}

jobs:
  phpcs:
    name: Run WPCS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --ansi

      - name: Install Node dependencies (for automation tooling)
        run: |
          if [ -f package.json ]; then npm ci --ignore-scripts; fi

      - name: WPCS check
        uses: 10up/wpcs-action@stable
        with:
          use_local_config: 'true'
          enable_warnings: true
          only_changed_files: true

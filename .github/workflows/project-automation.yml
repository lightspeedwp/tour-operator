name: Project Management Automation

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

# Prevent overlapping automation runs on the same PR
concurrency:
  group: project-automation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  project-automation:
    name: Run WordPress Project Management Automation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Project automation placeholder
        run: |
          echo "::notice::WordPress Gutenberg project automation action is not available"
          echo "::notice::Consider using alternative project automation or manual project management"
          echo "PR #${{ github.event.pull_request.number }} would be processed here"

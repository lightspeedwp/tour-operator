name: Tag & Changelog
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver (e.g. 2.1.0)'
        required: true
# The org default token is read-only; this workflow pushes a release tag.
permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create tag
        run: |
          git tag v${{ github.event.inputs.version }}
          git push origin v${{ github.event.inputs.version }}

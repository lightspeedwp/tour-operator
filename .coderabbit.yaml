# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-ZA"
early_access: false
commands:
  enabled: true
linked_issues:
  enabled: true
reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "develop"
      - "2.1-trunk"
      - "add/.*"
      - "fix/.*"
      - "update/.*"
      - "refactor/.*"
      - "feature/.*"
  path_filters:
    - "!build/**"
    - "!node_modules/**"
    - "!vendor/**"
    - "!assets/dist/**"
    - "!languages/*.mo"
    - "!languages/*.pot"
  path_instructions:
    - path: "**/*.{js,ts,tsx,jsx}"
      instructions: |
        Perform a detailed review of the provided code with following key aspects in mind:
        - Review the code to ensure it is well-structured and adheres to best practices.
        - Verify compliance with WordPress coding standards and @wordpress/eslint-plugin rules.
        - Ensure the code is well-documented with proper JSDoc comments.
        - Check for security vulnerabilities and confirm the code is secure.
        - Optimize the code for performance, removing any unnecessary elements.
        - Validate JSDoc comments for accuracy, currency, and adherence to WordPress coding standards.
        - Ensure each line comment concludes with a period.
        - Confirm every JSDoc comment includes a @since tag indicating the next version of the plugin to include the code.
        - Guarantee compatibility with the latest version of WordPress, avoiding deprecated functions or features.
        - Follow WordPress JavaScript coding standards and use WordPress script localization.
        - Use WordPress script dependencies and enqueue properly.
        - Ensure React/JSX best practices for blocks and modern JavaScript/TypeScript patterns.
        - Implement proper error handling and loading states.
        - Use WordPress components and design system where applicable.
        - For Tour Operator: Focus on tour booking interfaces, search functionality, and tour display components.
    - path: "**/*.{css,scss}"
      instructions: |
        Perform a detailed review of the provided code with following key aspects in mind:
        - Review the SCSS code to ensure it is well-structured and adheres to best practices.
        - Convert dimensions greater than or equal to 3px to rem units using the to_rem function.
        - Utilize variables for sizes and colors defined in src/content-helper/common/css/variables.scss instead of hardcoding values.
        - Follow WordPress CSS coding standards and use semantic class naming with tour-operator- prefix.
        - Ensure responsive design for all tour displays and booking forms.
        - Check for accessibility compliance (WCAG 2.2 AA).
        - Style complex tour layouts, booking forms, and destination galleries.
        - Use CSS custom properties and modern CSS features.
        - Ensure proper mobile-first responsive design for tourism content.
    - path: "**/*.{html,php}"
      instructions: |
        Perform a detailed review of the provided code with following key aspects in mind:
        - Review the HTML and PHP code to ensure it is well-structured and adheres to best practices.
        - Ensure the code follows WordPress coding standards (WPCS) and is well-documented.
        - Confirm the code is secure and free from vulnerabilities using proper sanitization and validation.
        - Escape all outputs using esc_html, esc_attr, wp_kses_post appropriately.
        - Use WordPress functions instead of native PHP where available.
        - Optimize the code for performance, removing any unnecessary elements.
        - Validate comments for accuracy, currency, and adherence to WordPress coding standards.
        - Ensure each line comment concludes with a period.
        - Add proper DocBlocks with @param, @return, @since tags.
        - Use meaningful variable and function names with tour_operator_ prefix.
        - Follow WordPress naming conventions (snake_case for functions/variables).
        - Verify code compatibility with the latest version of WordPress, avoiding deprecated functions.
        - Ensure proper template hierarchy usage and WordPress block theme patterns.
        - Validate HTML semantics and accessibility (WCAG 2.2 AA compliance).
    - path: 'includes/classes/*.php'
      instructions: |
        - Follow WordPress coding standards (WPCS) strictly with proper class structure.
        - Tour Operator specific: Focus on tour and destination management functionality.
        - Validate tour pricing, dates, and availability with proper data sanitization.
        - Implement proper booking and reservation workflows with secure data handling.
        - Use WordPress custom post types and taxonomies effectively.
        - Ensure tour data security and validation using WordPress nonce verification.
        - Follow complex tour operator business logic patterns with clear separation of concerns.
        - Ensure proper class naming with Tour_Operator_ prefix and consistent naming conventions.
        - Add comprehensive DocBlocks with @param, @return, @since tags.
        - Use dependency injection instead of singletons where possible.
        - Implement proper error handling and logging.
        - Ensure compatibility with WordPress multisite and internationalization.
    - path: 'post-types/*.json'
      instructions: |
        - Validate JSON schema for custom post types against WordPress standards.
        - Ensure proper field definitions for tours, destinations, accommodations with complete metadata.
        - Check for required fields and proper data types with validation rules.
        - Maintain consistency across post type configurations.
        - Follow WordPress post type registration best practices and naming conventions.
        - Ensure accessibility compliance in custom field definitions.
        - Validate against WordPress JSON schemas where applicable.
        - Document complex relationships between post types.
    - path: 'includes/blocks/*.php'
      instructions: |
        - Follow WordPress Block Editor (Gutenberg) best practices and modern block development.
        - Ensure proper block registration and attributes with complete block.json metadata.
        - Validate block output and sanitization using WordPress block APIs.
        - Use WordPress block APIs correctly with proper server-side rendering.
        - Ensure accessibility in block implementations (WCAG 2.2 AA compliance).
        - Implement proper block validation and security measures.
        - Use get_block_wrapper_attributes() and useBlockProps() appropriately.
        - Follow WordPress block development patterns and guidelines.
        - Ensure blocks work properly in different contexts (posts, pages, widgets).
    - path: 'src/blocks/**/*.{js,jsx,ts,tsx}'
      instructions: |
        - Follow WordPress JavaScript coding standards and @wordpress/scripts configuration.
        - Use WordPress components from @wordpress/components and design system.
        - Implement proper React/JSX patterns for WordPress blocks.
        - Ensure proper WordPress script dependencies and localization.
        - Use WordPress data store patterns with @wordpress/data.
        - Implement proper error boundaries and loading states.
        - Follow modern JavaScript/TypeScript patterns with proper typing.
        - Ensure accessibility in interactive block components.
        - Use WordPress block editor APIs correctly (useBlockProps, InspectorControls, etc.).
        - Implement proper block validation and save/edit functionality.
    - path: 'src/**/*.{css,scss}'
      instructions: |
        - Follow WordPress CSS coding standards and BEM methodology.
        - Use semantic class naming with tour-operator- prefix consistently.
        - Ensure responsive design for all tour displays and booking interfaces.
        - Check for accessibility compliance (WCAG 2.2 AA) including color contrast.
        - Style complex tour layouts, booking forms, and destination galleries effectively.
        - Use CSS custom properties and modern CSS features (Grid, Flexbox).
        - Implement proper mobile-first responsive design approach.
        - Use theme.json compatible styling where applicable.
        - Avoid !important declarations and maintain specificity hierarchy.
        - Ensure RTL (right-to-left) language support.
    - path: 'templates/*.html'
      instructions: |
        - Follow WordPress block theme patterns and template hierarchy.
        - Ensure proper template hierarchy usage with fallback templates.
        - Validate HTML semantics and accessibility (WCAG 2.2 AA compliance).
        - Use WordPress template parts effectively with proper naming.
        - Maintain consistency across template designs and layouts.
        - Implement proper WordPress hooks and filters integration.
        - Ensure template compatibility with different WordPress themes.
        - Use semantic HTML5 elements appropriately.
        - Implement proper schema markup for tourism content.
    - path: 'includes/taxonomies/*.php'
      instructions: |
        - Follow WordPress taxonomy registration best practices.
        - Ensure proper taxonomy configuration for tours, destinations, and travel categories.
        - Implement proper capability management and user permissions.
        - Add comprehensive metadata and custom fields to taxonomies.
        - Ensure proper internationalization support for taxonomy labels.
        - Implement proper REST API integration for taxonomies.
        - Follow WordPress naming conventions for taxonomy registration.
    - path: 'includes/template-tags/*.php'
      instructions: |
        - Create reusable template functions following WordPress conventions.
        - Ensure proper output escaping and data sanitization.
        - Implement consistent parameter handling and default values.
        - Add comprehensive DocBlocks with usage examples.
        - Ensure template tags work across different theme contexts.
        - Follow WordPress conditional tag patterns.
        - Implement proper caching where beneficial.
    - path: 'tests/**'
      instructions: |
        - Ensure comprehensive test coverage for tour operations and booking workflows.
        - Test booking workflows and pricing calculations with edge cases.
        - Test complex tour search and filtering functionality.
        - Follow WordPress testing best practices and WP_UnitTestCase patterns.
        - Use PHPUnit for PHP tests and Playwright for E2E tests effectively.
        - Test multi-site and WPML compatibility thoroughly.
        - Implement proper test data fixtures and factories.
        - Test accessibility compliance and responsive design.
        - Include performance testing for complex tour queries.
        - Test security measures and data validation.
    - path: 'languages/**'
      instructions: |
        - Ensure proper internationalization (i18n) implementation.
        - Validate translation file integrity and completeness.
        - Check for proper text domain usage throughout the codebase.
        - Ensure all user-facing strings are translatable.
        - Follow WordPress i18n best practices and guidelines.
    - path: '**/*.md'
      instructions: |
        - Keep documentation updated with code changes and new features.
        - Use clear examples for tour operator integration and API usage.
        - Document complex booking and tour management features with screenshots.
        - Include proper installation and configuration steps with troubleshooting.
        - Follow markdown linting rules and maintain consistent formatting.
        - On Pull Requests check for updates to the changelog file.
        - Ensure documentation covers accessibility features and requirements.
        - Include developer documentation for extending the plugin.
        - Document REST API endpoints and integration patterns.
chat:
  auto_reply: true

# Additional WordPress-specific configurations
knowledge_base:
  wordpress:
    version: "latest"
    coding_standards: "WPCS"
    accessibility: "WCAG 2.2 AA"

# Tour Operator Plugin Specific Settings
plugin_context:
  name: "Tour Operator"
  type: "WordPress Plugin"
  domain: "tour-operator"
  prefix: "lsx_to"
  class_prefix: "Tour_Operator"
  primary_features:
    - "Tour Management"
    - "Destination Management"
    - "Accommodation Booking"
    - "Travel Itineraries"
    - "Multi-site Support"
    - "WPML Integration"
